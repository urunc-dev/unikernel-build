name: Build and manifest

# Builds <app>/<framework>/<monitor>/bunnyfile-<arch> for each requested arch
# on a native runner, then combines them into a signed multi-arch manifest.
# If the context directory has a prebuild.sh, it runs before the image build.
# Images are reproducible: all inputs must be pinned by digest and timestamps
# are clamped to the epoch.

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      framework:
        required: true
        type: string
      monitor:
        required: true
        type: string
      arches:
        description: 'JSON list of architectures, e.g. ["amd64","arm64"]'
        required: true
        type: string
      push:
        description: "Push the images and the manifest"
        type: boolean
        default: true

permissions:
  id-token: write # for signing the manifest
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.app }}-${{ inputs.framework }}-${{ inputs.monitor }}
  CONTEXT: ${{ inputs.app }}/${{ inputs.framework }}/${{ inputs.monitor }}

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run prebuild hook
      working-directory: ${{ env.CONTEXT }}
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        if [ -f prebuild.sh ]; then
          bash prebuild.sh
        else
          echo "No prebuild.sh, skipping"
        fi

    # Pin the buildkit daemon: different buildkit versions produce different
    # layers from the same inputs, which would break reproducible images.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=moby/buildkit:v0.34.0

    - name: Log into registry ${{ env.REGISTRY }}
      if: ${{ inputs.push }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
      with:
        images: ${{ env.REGISTRY_IMAGE }}
        tags: |
          type=sha,prefix=${{ matrix.arch }}-,format=long

    - name: Build and push ${{ env.REGISTRY_IMAGE }}
      uses: docker/build-push-action@v6
      with:
        context: ./${{ env.CONTEXT }}
        file: ./${{ env.CONTEXT }}/bunnyfile-${{ matrix.arch }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/${{ matrix.arch }}
        # Clamp every timestamp to the epoch so identical inputs produce
        # identical image digests.
        build-args: |
          SOURCE_DATE_EPOCH=0
        outputs: type=image,push=${{ inputs.push }},rewrite-timestamp=true
        provenance: false

  manifest:
    name: manifest
    needs: build
    if: ${{ inputs.push }}
    runs-on: ubuntu-22.04
    steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.4.0

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and push manifest
      id: manifest
      env:
        ARCHES: ${{ inputs.arches }}
        SHA: ${{ github.sha }}
        DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        SOURCES=()
        for arch in $(jq -r '.[]' <<< "$ARCHES"); do
          SOURCES+=("${REGISTRY_IMAGE}:${arch}-${SHA}")
        done
        TAGS=(-t "${REGISTRY_IMAGE}:${SHA}")
        if [ "$DEFAULT_BRANCH" = true ]; then
          TAGS+=(-t "${REGISTRY_IMAGE}:latest")
        fi
        docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
        DIGEST=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${SHA}" --format '{{json .Manifest}}' | jq -r .digest)
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Sign the published manifest
      env:
        DIGEST: ${{ steps.manifest.outputs.digest }}
      run: |
        cosign sign --yes "${REGISTRY_IMAGE}@${DIGEST}" \
          -a "repo=${{ github.repository }}" \
          -a "workflow=${{ github.workflow }}" \
          -a "ref=${{ github.sha }}" \
          -a "author=Nubificus LTD"
