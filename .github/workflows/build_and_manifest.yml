name: Build unikernel and single application kernel images for all architectures and create manifests

on:
  workflow_call:
    inputs:
      app:
        description: "The target application to build"
        type: string
        required: true
      framework:
        description: "The target framework to build against"
        type: string
        required: true
      monitor:
        description: "The target monitor for the unikernel or single application kernel"
        type: string
        required: true
      boot_test:
        description: "Boot the built amd64 image with urunc after the manifest is pushed"
        type: boolean
        default: false
      expected_output:
        description: "String expected in the guest console output during boot test"
        type: string
        default: 'Hello from Unikraft!'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  check-arch:
    name: Find target architectures for ${{ inputs.app }}/${{ inputs.framework }}/${{ inputs.monitor }}
    runs-on: ubuntu-22.04
    outputs:
      amd64: ${{ steps.check.outputs.amd64 }}
      arm64: ${{ steps.check.outputs.arm64 }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check which bunnyfiles exist
      id: check
      run: |
        for arch in amd64 arm64; do
          if [ -f "${{ inputs.app }}/${{ inputs.framework }}/${{ inputs.monitor }}/bunnyfile-${arch}" ]; then
            echo "${arch}=true" >> "$GITHUB_OUTPUT"
            echo "Found bunnyfile for ${arch}"
          else
            echo "${arch}=false" >> "$GITHUB_OUTPUT"
            echo "No bunnyfile for ${arch}, skipping this architecture"
          fi
        done

  build-image-amd64:
    name: Monitor ${{ inputs.monitor }}
    needs: check-arch
    if: ${{ needs.check-arch.outputs.amd64 == 'true' }}
    uses: ./.github/workflows/build_images.yml
    with:
      app: ${{ inputs.app }}
      framework: ${{ inputs.framework }}
      monitor: ${{ inputs.monitor }}
      runner: "ubuntu-22.04"
      arch: "amd64"

  build-image-arm64:
    name: Monitor ${{ inputs.monitor }}
    needs: check-arch
    if: ${{ needs.check-arch.outputs.arm64 == 'true' }}
    uses: ./.github/workflows/build_images.yml
    with:
      app: ${{ inputs.app }}
      framework: ${{ inputs.framework }}
      monitor: ${{ inputs.monitor }}
      runner: "ubuntu-22.04-arm"
      arch: "arm64"

  create-manifest:
    name: Create manifest of ${{ inputs.app }} over ${{ inputs.framework }} and ${{ inputs.monitor }}
    needs: [build-image-amd64, build-image-arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}-${{ inputs.monitor }}-${{ inputs.framework }}
        tags: |
          type=sha,prefix=,format=long

    - name: Create manifest
      run: |
        TAGS=${{ steps.meta.outputs.tags }}
        IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}-${{ inputs.monitor }}-${{ inputs.framework }}
        SHA_TAG=${{ steps.meta.outputs.version }}
        docker manifest rm $TAGS || true
        if [[ "${{ needs.build-image-amd64.outputs.result }}" == "success" ]] &&
           [[ "${{ needs.build-image-arm64.outputs.result }}" == "success" ]]
        then
          docker manifest create $TAGS \
             --amend ${IMAGE}:amd64-${SHA_TAG} \
             --amend ${IMAGE}:arm64-${SHA_TAG}
        elif [[ "${{ needs.build-image-amd64.outputs.result }}" != "success" ]] &&
           [[ "${{ needs.build-image-arm64.outputs.result }}" == "success" ]]
        then
          docker manifest create $TAGS \
             --amend ${IMAGE}:arm64-${SHA_TAG}
        elif [[ "${{ needs.build-image-amd64.outputs.result }}" == "success" ]] &&
           [[ "${{ needs.build-image-arm64.outputs.result }}" != "success" ]]
        then
          docker manifest create $TAGS \
             --amend ${IMAGE}:amd64-${SHA_TAG}
        else
          echo "None of amd64 or arm64 images were built"
          exit 1
        fi
        docker manifest push $TAGS

  boot-test:
    name: Boot test ${{ inputs.app }}-${{ inputs.monitor }}-${{ inputs.framework }}
    needs: [check-arch, build-image-amd64]
    if: ${{ inputs.boot_test && needs.check-arch.outputs.amd64 == 'true' && needs.build-image-amd64.outputs.result == 'success' }}
    uses: ./.github/workflows/test-boot.yml
    with:
      image: ghcr.io/${{ github.repository }}/${{ inputs.app }}-${{ inputs.monitor }}-${{ inputs.framework }}:amd64-${{ github.sha }}
      monitor: ${{ inputs.monitor }}
      arch: amd64
      expected_output: ${{ inputs.expected_output }}
