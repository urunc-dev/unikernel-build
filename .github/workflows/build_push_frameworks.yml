name: Build and push image

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      changed:
        required: true
        type: string
      framework:
        required: true
        type: string
    secrets:
      GIT_CLONE_PAT:
        required: true

jobs:
  build-image:
    name: Build and push image for ${{ inputs.app }} over ${{ inputs.framework }}
    if: |
      contains(fromJSON(inputs.changed), 'src') ||
      contains(fromJSON(inputs.changed), inputs.framework)
    runs-on: [ ubuntu-22.04, ubuntu-22.04-arm ]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set short SHA
      run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
      with:
        images: ${{ env.REGISTRY_IMAGE }}
        tags: |
          type=sha,prefix=${{ matrix.arch }}-

    - name: Get revision SHA and branch
      id: get-rev
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          if [ "${{ github.event.pull_request.merged }}" == true ]; then
            sha="${{ github.sha }}"
            branch="${{ github.base_ref }}"
            echo "PR merged. SHA: ${sha}, Branch: ${branch}"
          else
            sha="${{ github.event.pull_request.head.sha }}"
            branch="${{ github.event.pull_request.head.ref }}"
            echo "PR not yet merged. SHA: ${sha}, Branch: ${branch}"
          fi
        else
          sha="${{ github.sha }}"
          branch="${{ github.ref_name }}"
          echo "${{ github.event_name }} event. SHA: ${sha}, Branch: ${branch}"
        fi
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Copy source code
      run: |
        cp -r ./$${ inputs.app }}/src/* ./${{ inputs.app }}/$${ inputs.framework }}

    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
          context: ./${{ inputs.app }}/${{ inputs.framework }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          file: ./${{ inputs.app }}/${{ inputs.framework }}/bunnyfile-hvt-${{ matrix.arch }}

