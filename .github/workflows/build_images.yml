name: Build unikernel and single application kernel images for specific app,framework,monitor and arch

on:
  workflow_call:
    inputs:
      app:
        description: "The target application to build"
        type: string
        required: true
      framework:
        description: "The target framework to build against"
        type: string
        required: true
      monitor:
        description: "The target monitor for the unikernel or single application kernel"
        type: string
        required: true
      runner:
        description: "The runner to build the image"
        type: string
        required: true
      arch:
        description: "The CPU architecture"
        type: string
        required: true
    outputs:
      result:
        description: "The result of build attempt"
        value: ${{ jobs.build-image.outputs.result }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    name: App ${{ inputs.app }} Framework ${{ inputs.framework }} Monitor ${{ inputs.monitor }} Arch ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    outputs:
      result: ${{ steps.result.outputs.status }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set short SHA
      run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

    # Pin the buildkit daemon below v0.31: since v0.31 the platform matcher
    # treats os.features as a required subset, and unikraft catalog manifests
    # carry their full kconfig in os.features, so kernel.from resolution fails
    # with "no match for platform in manifest".
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=moby/buildkit:v0.30.0

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}-${{ inputs.monitor }}-${{ inputs.framework }}
        tags: |
          type=sha,prefix=${{ inputs.arch }}-,format=long

    - name: Stage mirage-skeleton app source
      if: ${{ inputs.framework == 'mirage' }}
      run: |
        git submodule update --init mirage-skeleton
        case "${{ inputs.app }}" in
          net-mirage) src=device-usage/network ;;
          hello-key-mirage) src=tutorial/hello-key ;;
        esac
        cp "mirage-skeleton/$src/config.ml" "mirage-skeleton/$src/unikernel.ml" \
          "${{ inputs.app }}/${{ inputs.framework }}/${{ inputs.monitor }}/"

    - name: Checkout rumprun-packages
      if: ${{ inputs.framework == 'rumprun' }}
      uses: actions/checkout@v4
      with:
        repository: cloudkernels/rumprun-packages
        ref: feat_update_docker
        path: rumprun-packages

    - name: Stage rumprun app data
      if: ${{ inputs.framework == 'rumprun' }}
      run: |
        case "${{ inputs.app }}" in
          rumprun-httpreply) src=nginx ;;
          rumprun-redis) src=redis ;;
        esac
        cp -r "rumprun-packages/$src/data" \
          "${{ inputs.app }}/${{ inputs.framework }}/${{ inputs.monitor }}/data"

    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
          context: ./${{ inputs.app }}/${{ inputs.framework }}/${{ inputs.monitor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ inputs.arch }}
          push: true
          provenance: false
          file: ./${{ inputs.app }}/${{ inputs.framework }}/${{ inputs.monitor }}/bunnyfile-${{ inputs.arch }}

    - name: Collect build result
      id: result
      if: ${{ !cancelled() }}
      run: |
        echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"
