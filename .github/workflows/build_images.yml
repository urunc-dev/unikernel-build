name: Build unikernel and single application kernel images for specific app,framework,monitor and arch

on:
  workflow_call:
    inputs:
      app:
        description: "The target application to build"
        type: string
        required: true
      framework:
        description: "The target framework to build against"
        type: string
        required: true
      monitor:
        description: "The target monitor for the unikernel or single application kernel"
        type: string
        required: true
      runner:
        description: "The runner to build the image"
        type: string
        required: true
      arch:
        description: "The CPU architecture"
        type: string
        required: true
    outputs:
      result:
        description: "The result of build attempt"
        value: ${{ jobs.build-image.outputs.result }}

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    name: App ${{ inputs.app }} Framework ${{ inputs.framework }} Monitor ${{ inputs.monitor }} Arch ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    outputs:
      result: ${{ steps.result.outputs.status }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set short SHA
      run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/hello-world-${{ inputs.monitor }}-${{ inputs.framework }}
        tags: |
          type=sha,prefix=${{ inputs.arch }}-,format=long

    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
          context: ./hello-world/${{ inputs.framework }}/${{ inputs.monitor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ inputs.arch }}
          push: true
          provenance: false
          file: ./hello-world/${{ inputs.framework }}/${{ inputs.monitor }}/bunnyfile-${{ inputs.arch }}

    - name: Collect build result
      id: result
      if: ${{ !cancelled() }}
      run: |
        echo "status=${{ job.status }}" >> $GITHUB_OUTPUT
