name: Find the frameworks to build for an application

on:
  workflow_call:
    inputs:
      app:
        description: "The target application to build"
        type: string
        required: true
      changed_apps:
        description: "The JSON object with all information for changed files"
        type: string
        required: true

jobs:
  get-frameworks:
    name: Get the frameworks to build against
    runs-on: ubuntu-22.04
    outputs:
      frameworks: ${{ steps.filter.outputs.frameworks }}
      frameworks_json: ${{ steps.filter.outputs.frameworks_json }}
    steps:
    - name: Show input
      run: |
        echo "Input app: ${{ inputs.app }}"
        echo "Input json: ${{ inputs.changed_apps }}"

    - name: Get frameworks to build against
      id: filter
      run: |
        APP=${{ inputs.app }}
        FRAMEWORKS_JSON=$(echo '${{ inputs.changed_apps }}' | \
          jq -c --arg app "$APP" '.[$app]'
        )
        FRAMEWORKS=$(echo '${{ inputs.changed_apps }}' | \
          jq -c --arg app "$APP" '.[$app] | keys'
        )
        echo "frameworks=$FRAMEWORKS" >> "$GITHUB_OUTPUT"
        echo "frameworks_json=$FRAMEWORKS_JSON" >> "$GITHUB_OUTPUT"

    - name: Show changed files
      run: |
        echo "Frameworks to build: ${{ steps.filter.outputs.frameworks }}"
        echo "frameworks json: ${{ steps.filter.outputs.frameworks_json }}"

  for-each-framework:
    name: Find the monitors for ${{ inputs.app }} and each framework
    needs: get-frameworks
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.get-frameworks.outputs.frameworks) }}
    uses: ./.github/workflows/separate_monitors.yml
    with:
      app: ${{ inputs.app }}
      framework: ${{ matrix.framework }}
      frameworks_object: ${{ needs.get-frameworks.outputs.frameworks_json }}
