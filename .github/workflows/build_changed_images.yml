name: Build changed images (diff-driven)

# Manual-only while the pipeline is being stabilized. Compares the current ref
# against `base` and rebuilds only the app/framework/monitor combinations whose
# files changed. Re-enable a push trigger once the matrix is trusted.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to diff against for change detection"
        type: string
        default: 'main'
      boot_test:
        description: "Boot the built amd64 images with urunc"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  get-changed-files:
    runs-on: ubuntu-22.04
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
      changed_json: ${{ steps.format.outputs.build }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get changed files
      id: filter
      uses: dorny/paths-filter@668c092af3649c4b664c54e4b704aa46782f6f7c
      with:
        list-files: 'json'
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ${{ inputs.base }}
        filters: |
          hello-world:
            - 'hello-world/**'
          hello-env:
            - 'hello-env/**'
          hello-exec-env:
            - 'hello-exec-env/**'
          hello-server:
            - 'hello-server/**'
          httpreply:
            - 'httpreply/**'
          nginx:
            - 'nginx/**'
          redis:
            - 'redis/**'
          net:
            - 'net/**'
          block-test:
            - 'block-test/**'
          whoami:
            - 'whoami/**'
          busybox:
            - 'busybox/**'

    - name: Format build json
      id: format
      env:
        FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
      run: |
        # Merge the changed-file lists of ALL filters (not just hello-world) and
        # fold the app/framework/monitor/file paths into a nested JSON object.
        DIRS_TO_JSON=$(echo "$FILTER_OUTPUTS" | jq -c '
          [ to_entries[]
            | select(.key | endswith("_files"))
            | (.value | fromjson? // []) ]
          | add // []
          | map(split("/"))
          | map(select(length == 4))
          | reduce .[] as $p ({}; .[$p[0]][$p[1]][$p[2]] += [$p[3]])
        ')
        echo "build=$DIRS_TO_JSON" >> "$GITHUB_OUTPUT"

    - name: Show changed files
      run: |
        echo "Changes: ${{ steps.filter.outputs.changes }}"
        echo "Changed files in json: ${{ steps.format.outputs.build }}"

  for-each-app:
    name: Build and push
    needs: get-changed-files
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.get-changed-files.outputs.apps) }}
    uses: ./.github/workflows/separate_frameworks.yml
    with:
      app: ${{ matrix.app }}
      changed_apps: ${{ needs.get-changed-files.outputs.changed_json }}
      boot_test: ${{ inputs.boot_test }}
