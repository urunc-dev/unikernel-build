name: Check and build changed apps

on:
  workflow_dispatch:
  push:
    branches:
      - ref_build_from_changed_files

env:
  REGISTRY: ghcr.io
  framework: unikraft
  monitor: qemu

jobs:
  get-changed-files:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
      hello-world: ${{ steps.filter.outputs.hello-world }}
      hello-world_files: ${{ steps.filter.outputs.hello-world_files }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Get changed files
      id: filter
      uses: dorny/paths-filter@668c092af3649c4b664c54e4b704aa46782f6f7c
      with:
        list-files: 'json'
        token: ${{ secrets.GITHUB_TOKEN }}
        filters: |
          hello-world:
            - 'hello-world/src/**'
            - 'hello-world/rumprun/**'
            - 'hello-world/mirage/**'
            - 'hello-world/mewz/**'
            - 'hello-world/unikraft/**'
            - 'hello-world/linux/**'

    - name: Show changed files
      run: |
        echo "Files in hello-world: ${{ steps.filter.outputs.hello-world_files }}"
        echo "Changes: ${{ steps.filter.outputs.changes }}"

  build-image:
    name: Build and push image
    needs: get-changed-files
    if: |
      needs.get-changed-files.outputs.hello-world_files != '' &&
      (
        contains(needs.get-changed-files.outputs.hello-world_files, 'src') ||
        contains(needs.get-changed-files.outputs.hello-world_files, 'unikraft')
      )
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set short SHA
      run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/hello-world-${{ env.monitor }}-${{ env.framework }}
        tags: |
          type=sha,prefix=${{ matrix.arch }}-,format=long

    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
          context: ./hello-world/${{ env.framework }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          file: ./hello-world/${{ env.framework }}/bunnyfile-${{ env.monitor }}-${{ matrix.arch }}

  create-manifest:
    needs: [build-image]
    runs-on: ubuntu-22.04
    steps:

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.4.0

    - name: Check install!
      run: cosign version

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/hello-world-${{ env.monitor }}-${{ env.framework }}
        tags: |
          type=sha,prefix=,format=long

    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
          context: ./hello-world/${{ env.framework }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          file: ./hello-world/${{ env.framework }}/bunnyfile-${{ env.monitor }}-${{ matrix.arch }}
    - name: Create manifest
      run: |
        TAGS=${{ steps.meta.outputs.tags }}
        IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/hello-world-${{ env.monitor }}-${{ env.framework }}
        docker manifest rm $TAGS || true
        docker manifest create $TAGS \
           --amend ${IMAGE}:amd64-${{ steps.meta.outputs.tag-names }} \
           --amend ${IMAGE}:arm64-${{ steps.meta.outputs.tag-names }}
        HASH=$(docker manifest push $TAGS)
        echo "hash=$HASH" >> $GITHUB_ENV
        echo "tags=$TAGS" >> $GITHUB_ENV

    - name: Sign the published Docker image
      env:
        COSIGN_EXPERIMENTAL: "true"
        DIGEST: ${{ env.hash }}
        TAGS: ${{ env.tags }}
      run: |
        cosign sign --yes ${{ env.REGISTRY_IMAGE }}@${{ env.DIGEST }} \
        -a "repo=${{github.repository}}" \
        -a "workflow=${{github.workflow}}" \
        -a "ref=${{github.sha}}" \
        -a "author=urunc-dev/unikernel-build"

